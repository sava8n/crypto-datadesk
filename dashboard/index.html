<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Datadesk</title>
  </head>
  <body>
    <!-- stamp the theme before first paint, or the page opens on the wrong one for a frame -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('datadesk.settings.v3') || '{}');
      } catch (e) {
        /* unparseable blob or storage blocked: the default applies */
      }
      document.documentElement.dataset.theme = s && s.theme === 'dark' ? 'dark' : 'light';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
