services:
  db:
    image: postgres:17-alpine
    container_name: datadesk-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  core:
    build: ./core
    container_name: datadesk-core
    ports:
      - "8000:8000"
    environment:
      - DATADESK_SERVICE_DB_DSN=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATADESK_SERVICE_OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DATADESK_SERVICE_REPORT_SOURCE=${REPORT_SOURCE:-openrouter}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: datadesk-dashboard
    ports:
      - "8080:80"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
