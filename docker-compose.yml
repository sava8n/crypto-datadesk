services:
  db:
    image: postgres:17-alpine
    container_name: datadesk-db
    environment:
      - POSTGRES_USER=datadesk
      - POSTGRES_PASSWORD=datadesk
      - POSTGRES_DB=datadesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datadesk -d datadesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  core:
    build: ./core
    container_name: datadesk-core
    ports:
      - "8000:8000"
    environment:
      - DATADESK_SERVICE_CORS_ORIGINS=http://localhost:8080,http://localhost:5173
      - DATADESK_SERVICE_SUPPORTED_CURRENCIES=BTC
      - DATADESK_SERVICE_LOG_LEVEL=INFO
      - DATADESK_SERVICE_MARKET_CACHE_TTL_SECONDS=10
      - DATADESK_SERVICE_MIN_MARK_PRICE=0.0005
      - DATADESK_SERVICE_DB_DSN=postgresql+psycopg://datadesk:datadesk@db:5432/datadesk
      - DATADESK_SERVICE_PERSISTENCE_ENABLED=true
      - DATADESK_SERVICE_SNAPSHOT_INTERVAL_SECONDS=3600
      - DATADESK_SERVICE_RETENTION_DAYS=365
      - DATADESK_SERVICE_RETENTION_SWEEP_HOUR_UTC=0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: datadesk-dashboard
    ports:
      - "8080:80"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
