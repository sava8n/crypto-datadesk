name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-core:
    name: Lint core (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: core/requirements-dev.txt
      - name: Install ruff
        run: pip install -r core/requirements-dev.txt
      - name: ruff check
        working-directory: core
        run: ruff check --output-format=github .
      - name: ruff format
        working-directory: core
        run: ruff format --check .

  lint-dashboard:
    name: Lint dashboard (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: biome ci
        working-directory: dashboard
        run: npx biome ci src

  test-core:
    name: Test core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            core/requirements.txt
            core/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r core/requirements.txt -r core/requirements-dev.txt
      - name: Run pytest
        working-directory: core
        run: python -m pytest

  test-dashboard:
    name: Test dashboard (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Run vitest
        working-directory: dashboard
        run: npm test

  build:
    name: Build ${{ matrix.service }} image
    needs: [lint-core, lint-dashboard, test-core, test-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [core, dashboard]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          # only main writes the cache, so PR branches cannot evict its layers
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
